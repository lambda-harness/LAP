repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: python -m black --check
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: python -m isort --check-only
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy --strict src tests tools examples
        language: system
        pass_filenames: false
