name: Verify LAP Draft

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m black --check src tests tools examples
      - run: python -m isort --check-only src tests tools examples
      - run: python -m ruff check src tests tools examples
      - run: python -m mypy --strict src tests tools examples
      - run: python -m pytest
      - run: python tools/check_coverage.py --input coverage.xml --minimum-line-rate 90 --minimum-branch-rate 80

  node-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: node --check examples/echo-agent-node/echo_agent.js
      - run: node --check examples/orchestrator-agent-node/orchestrator_agent.js
      - run: python -m pytest
      - run: python tools/check_coverage.py --input coverage.xml --minimum-line-rate 90 --minimum-branch-rate 80

  go-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: go test ./...
        working-directory: sdk/go
      - name: Verify canonical Go module identity
        run: test "$(go list -m)" = "github.com/lambda-harness/LAP/sdk/go"
        working-directory: sdk/go
      - run: go vet ./...
        working-directory: sdk/go
      - run: go build .
        working-directory: examples/echo-agent-go
      - run: python -m pytest
      - run: python tools/check_coverage.py --input coverage.xml --minimum-line-rate 90 --minimum-branch-rate 80

  published-go-sdk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
      - name: Install the published SDK as an external Go consumer
        env:
          LAP_MODULE: github.com/lambda-harness/LAP/sdk/go
          LAP_REVISION: ${{ github.sha }}
          GOPROXY: direct
        run: |
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          go mod init example.com/lap-published-sdk-check
          go get "${LAP_MODULE}@${LAP_REVISION}"
          test "$(go list -m -f '{{.Path}}' "$LAP_MODULE")" = "$LAP_MODULE"
          cat > main.go <<'EOF'
          package main

          import _ "github.com/lambda-harness/LAP/sdk/go"

          func main() {}
          EOF
          go build ./...

  rust-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: cargo test --locked
        working-directory: examples/echo-agent-rust
      - run: python -m pytest
      - run: python tools/check_coverage.py --input coverage.xml --minimum-line-rate 90 --minimum-branch-rate 80
